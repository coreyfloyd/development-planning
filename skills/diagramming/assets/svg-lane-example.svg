<svg viewBox="0 0 1120 300" role="img" aria-label="A validated request flows from intake through validation to storage; a secondary source is not probed">
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
    <path d="M0,0 L8,3.2 L0,6.4 z" fill="var(--dim)"/>
  </marker></defs>
  <rect x="8" y="16" width="720" height="270" rx="14" fill="none" stroke="var(--line)" stroke-width="2"/>
  <rect x="24" y="6" width="220" height="22" rx="6" fill="var(--panel)"/>
  <text x="30" y="22" font-size="14" fill="var(--ink)">Processing — OBSERVED</text>
  <rect x="40" y="95" width="260" height="65" rx="8" fill="var(--node)" stroke="var(--nodeline)"/>
  <text x="58" y="132" font-size="16" fill="var(--ink)" style="font-family:var(--mono)">Intake</text>
  <rect x="420" y="95" width="260" height="65" rx="8" fill="var(--node)" stroke="var(--ok)"/>
  <text x="438" y="132" font-size="16" fill="var(--ink)" style="font-family:var(--mono)">Validation: OK</text>
  <path d="M300,127 L420,127" fill="none" stroke="var(--dim)" marker-end="url(#ar)"/>
  <text x="330" y="114" font-size="12" fill="var(--dim)">request</text>
  <rect x="760" y="16" width="350" height="270" rx="14" fill="none" stroke="var(--off)" stroke-dasharray="7 5"/>
  <text x="780" y="46" font-size="14" fill="var(--dim)">Persistence</text>
  <rect x="790" y="95" width="285" height="65" rx="8" fill="var(--node)" stroke="var(--nodeline)"/>
  <text x="810" y="132" font-size="16" fill="var(--ink)" style="font-family:var(--mono)">Storage</text>
  <path d="M680,127 L790,127" fill="none" stroke="var(--dim)" marker-end="url(#ar)"/>
  <rect x="790" y="200" width="285" height="55" rx="8" fill="var(--offbg)" stroke="var(--off)" stroke-dasharray="4 3"/>
  <text x="810" y="232" font-size="14" fill="var(--dim)">Secondary source — NOT PROBED</text>
</svg>
